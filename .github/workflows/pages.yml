name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get
        working-directory: flutter_app


      - name: Check Flutter version
        run: flutter --version

      - name: Build web
        run: flutter build web --release --base-href /From-Fridge-to-Fork/ --verbose
        working-directory: flutter_app
        - name: Build web (save logs)
          run: |
            set -o pipefail
            flutter build web --release --base-href /From-Fridge-to-Fork/ --verbose 2>&1 | tee flutter_build.log
          working-directory: flutter_app

        - name: Upload Flutter build logs
          uses: actions/upload-artifact@v4
          with:
            name: flutter-build-logs
            path: flutter_app/flutter_build.log

        - name: Upload GitHub Pages artifact
          uses: actions/upload-pages-artifact@v4
          with:
            path: flutter_app/build/web

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4